<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğurlu Ödəniş - HəcZiyarətiAz</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f8f9fa, #e8f5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .success-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #2e8b57;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            line-height: 1.7;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            background: #2e8b57;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }
        .btn:hover {
            background: #246c45;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon">✅</div>
        <h1>Ödəniş Uğurla Tamamlandı!</h1>
        <p>
            Müraciətiniz qəbul olundu. <br>
            Məlumatlarınız bizə çatdı. .<br><br>
            <strong>Tezliklə sizinlə əlaqə saxlanılacaq.</strong>
        </p>
        <p style="margin-top: 25px; font-size: 16px; color: #777;">
            Həcc ziyarətiniz mübarək olsun! 🕋
        </p>
        
        <a href="/" class="btn">Ana Səhifəyə Qayıt</a>
    </div>

</body>
</html>
